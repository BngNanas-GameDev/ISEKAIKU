org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.hosts.file=C:/Android/hosts-java.txt -Dcom.sun.net.ssl.checkRevocation=false
android.useAndroidX=true
android.enableJetifier=true

# Jaringan di mesin ini flaky (DNS lambat / revocation server tidak terjangkau).
# Timeout lebih longgar + matikan pemeriksaan revocation agar resolusi plugin
# Gradle tidak gagal karena masalah sertifikat.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.com.sun.net.ssl.checkRevocation=false
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=500

# DNS lokal sering gagal resolve (UnknownHostException acak).
# File hosts ini dipakai JVM Gradle agar tidak bergantung DNS sistem.
systemProp.jdk.net.hosts.file=C:/Android/hosts-java.txt

org.gradle.parallel=true
org.gradle.caching=true
